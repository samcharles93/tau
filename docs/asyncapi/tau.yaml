info:
    description: |
        Real-time protocol between the Tau chat runtime and its Web UI. All
        communication happens over a single WebSocket connection on the local Tau
        process. The runtime publishes chat events; the browser sends chat commands.
    title: Tau Web UI Protocol
    version: 0.1.0
operations:
    receiveEvents:
        action: receive
        channel:
            $ref: '#/channels/tauWebSocket'
        messages:
            - $ref: '#/channels/tauWebSocket/messages/init'
            - $ref: '#/channels/tauWebSocket/messages/event'
            - $ref: '#/channels/tauWebSocket/messages/error'
    sendCommands:
        action: send
        channel:
            $ref: '#/channels/tauWebSocket'
        messages:
            - $ref: '#/channels/tauWebSocket/messages/command'
servers:
    local:
        description: Local Tau WebSocket endpoint. Port is chosen by Tau (ephemeral by default) and printed at startup.
        host: localhost:{port}
        pathname: /ws
        protocol: ws
