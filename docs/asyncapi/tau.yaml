asyncapi: '3.0.0'
info:
  title: Tau Web UI Protocol
  version: '0.1.0'
  description: |
    Real-time protocol between the Tau chat runtime and its Web UI. All
    communication happens over a single WebSocket connection on the local Tau
    process. The runtime publishes chat events; the browser sends chat commands.

servers:
  local:
    host: localhost:{port}
    pathname: /ws
    protocol: ws
    description: Local Tau WebSocket endpoint. Port is chosen by Tau (ephemeral by default) and printed at startup.

operations:
  receiveEvents:
    action: receive
    channel:
      $ref: '#/channels/tauWebSocket'
    messages:
      - $ref: '#/channels/tauWebSocket/messages/init'
      - $ref: '#/channels/tauWebSocket/messages/event'
      - $ref: '#/channels/tauWebSocket/messages/error'
  sendCommands:
    action: send
    channel:
      $ref: '#/channels/tauWebSocket'
    messages:
      - $ref: '#/channels/tauWebSocket/messages/command'

channels:
  tauWebSocket:
    address: /ws
    messages:
      init:
        name: InitMessage
        title: Connection init
        contentType: application/json
        payload:
          $ref: '#/components/schemas/InitMessage'
      event:
        name: ChatEventEnvelope
        title: Chat event
        contentType: application/json
        payload:
          $ref: '#/components/schemas/ChatEventEnvelope'
      command:
        name: ChatCommandEnvelope
        title: Chat command
        contentType: application/json
        payload:
          $ref: '#/components/schemas/ChatCommandEnvelope'
      error:
        name: ErrorEnvelope
        title: Protocol error
        contentType: application/json
        payload:
          $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    InitMessage:
      type: object
      required: [type, session_id, model, provider]
      properties:
        type:
          type: string
          const: init
        session_id:
          type: string
          description: ID of the active session managed by this Tau process.
        model:
          type: string
          description: Current model ID.
        provider:
          type: string
          description: Current provider name.
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CommandRef'
          description: Available slash commands at connection time.

    ChatEventEnvelope:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          description: Concrete ChatEvent type name (e.g. ChatResponseDeltaEvent).
        payload:
          oneOf:
            - $ref: '#/components/schemas/ChatSessionSnapshotEvent'
            - $ref: '#/components/schemas/ChatResponseStartedEvent'
            - $ref: '#/components/schemas/ChatResponseDeltaEvent'
            - $ref: '#/components/schemas/ChatReasoningDeltaEvent'
            - $ref: '#/components/schemas/ChatToolCallDeltaEvent'
            - $ref: '#/components/schemas/ChatToolExecutionStartedEvent'
            - $ref: '#/components/schemas/ChatToolExecutionCompletedEvent'
            - $ref: '#/components/schemas/ChatToolOutputEvent'
            - $ref: '#/components/schemas/ChatResponseCompletedEvent'
            - $ref: '#/components/schemas/ChatResponseCancelledEvent'
            - $ref: '#/components/schemas/ChatRuntimeErrorEvent'
            - $ref: '#/components/schemas/ChatNotificationEvent'
            - $ref: '#/components/schemas/ExtensionsReloadedEvent'
            - $ref: '#/components/schemas/ExtensionCommandsChangedEvent'
            - $ref: '#/components/schemas/ExtensionCommandResultEvent'
            - $ref: '#/components/schemas/InteractivePromptRequestedEvent'
            - $ref: '#/components/schemas/SessionsListedEvent'
            - $ref: '#/components/schemas/SessionLoadedEvent'
            - $ref: '#/components/schemas/SessionDeletedEvent'
            - $ref: '#/components/schemas/SessionExportedEvent'
            - $ref: '#/components/schemas/CommandsChangedEvent'

    ChatCommandEnvelope:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          description: Concrete ChatCommand type name (e.g. SubmitChatPromptCommand).
        payload:
          oneOf:
            - $ref: '#/components/schemas/StartChatSessionCommand'
            - $ref: '#/components/schemas/SubmitChatPromptCommand'
            - $ref: '#/components/schemas/SteerChatPromptCommand'
            - $ref: '#/components/schemas/UpdateChatSessionCommand'
            - $ref: '#/components/schemas/CancelChatRequestCommand'
            - $ref: '#/components/schemas/ResetChatSessionCommand'
            - $ref: '#/components/schemas/CloseChatSessionCommand'
            - $ref: '#/components/schemas/ReloadExtensionsCommand'
            - $ref: '#/components/schemas/RunExtensionCommandCommand'
            - $ref: '#/components/schemas/RespondInteractivePromptCommand'
            - $ref: '#/components/schemas/ListSessionsCommand'
            - $ref: '#/components/schemas/LoadSessionCommand'
            - $ref: '#/components/schemas/DeleteSessionCommand'
            - $ref: '#/components/schemas/ExportSessionCommand'

    ErrorEnvelope:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: error
        payload:
          type: string
          description: Human-readable error message.

    # ── Common primitives ─────────────────────────────────────────────────────

    CommandRef:
      type: object
      required: [name]
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        accepts_args:
          type: boolean

    ChatModelRef:
      type: object
      required: [id, provider]
      properties:
        id:
          type: string
        provider:
          type: string
        base_url:
          type: string

    ChatParameters:
      type: object
      properties:
        max_tokens:
          type: integer
        temperature:
          type: number
        reasoning_effort:
          type: string

    ChatSessionPatch:
      type: object
      properties:
        model:
          $ref: '#/components/schemas/ChatModelRef'
        system_prompt:
          type: string
        show_reasoning:
          type: boolean
        reasoning_effort:
          type: string
        max_tokens:
          type: integer
        temperature:
          type: number

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolCall'
        tool_call_id:
          type: string
        name:
          type: string

    ChatToolCall:
      type: object
      required: [id, type, function]
      properties:
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          required: [name, arguments]
          properties:
            name:
              type: string
            arguments:
              type: string

    ChatToolDef:
      type: object
      required: [type, function]
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required: [name, description, parameters]
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object

    ChatUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer

    ChatSessionState:
      type: object
      required: [session_id, messages]
      properties:
        session_id:
          type: string
        model:
          $ref: '#/components/schemas/ChatModelRef'
        system_prompt:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        parameters:
          $ref: '#/components/schemas/ChatParameters'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ChatToolDef'

    SessionSummary:
      type: object
      required: [id, model_id, provider, created_at, updated_at, status, message_count, input_tokens, output_tokens, total_tokens, cost, duration_ms]
      properties:
        id:
          type: string
        model_id:
          type: string
        provider:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
        message_count:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        cost:
          type: number
        duration_ms:
          type: integer
        system_prompt:
          type: string
        parent_session_id:
          type: string

    ExtensionCommand:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        extension_name:
          type: string

    ExtensionDiagnostic:
      type: object
      required: [severity, message]
      properties:
        path:
          type: string
        extension_name:
          type: string
        severity:
          type: string
        message:
          type: string

    ExtensionReloadResult:
      type: object
      required: [extension_count]
      properties:
        extension_count:
          type: integer
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionDiagnostic'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionCommand'

    InteractivePromptKind:
      type: string
      enum: [confirm, question]

    # ── ChatEvent payloads ────────────────────────────────────────────────────

    ChatSessionSnapshotEvent:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/ChatSessionState'

    ChatResponseStartedEvent:
      type: object
      required: [session_id, request_id, started_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        started_at:
          type: string
          format: date-time

    ChatResponseDeltaEvent:
      type: object
      required: [session_id, request_id, delta, snapshot, received_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        delta:
          type: string
        snapshot:
          type: string
        received_at:
          type: string
          format: date-time

    ChatReasoningDeltaEvent:
      type: object
      required: [session_id, request_id, delta, snapshot, received_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        delta:
          type: string
        snapshot:
          type: string
        received_at:
          type: string
          format: date-time

    ChatToolCallDeltaEvent:
      type: object
      required: [session_id, request_id, call_id, index, tool_name, arguments_summary, received_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        call_id:
          type: string
        index:
          type: integer
        tool_name:
          type: string
        arguments_summary:
          type: string
        truncated:
          type: boolean
        received_at:
          type: string
          format: date-time

    ChatToolExecutionStartedEvent:
      type: object
      required: [session_id, request_id, call_id, tool_name, arguments_summary, started_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        call_id:
          type: string
        tool_name:
          type: string
        arguments_summary:
          type: string
        started_at:
          type: string
          format: date-time

    ChatToolExecutionCompletedEvent:
      type: object
      required: [session_id, request_id, call_id, tool_name, status, duration, result_summary, is_error, completed_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        call_id:
          type: string
        tool_name:
          type: string
        status:
          type: string
        duration:
          type: integer
          description: Duration in nanoseconds.
        result_summary:
          type: string
        is_error:
          type: boolean
        truncated:
          type: boolean
        completed_at:
          type: string
          format: date-time

    ChatToolOutputEvent:
      type: object
      required: [session_id, request_id, call_id, chunk, received_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        call_id:
          type: string
        chunk:
          type: string
        received_at:
          type: string
          format: date-time

    ChatResponseCompletedEvent:
      type: object
      required: [state, request_id, finish_reason, usage, completed_at]
      properties:
        state:
          $ref: '#/components/schemas/ChatSessionState'
        request_id:
          type: string
        finish_reason:
          type: string
        usage:
          $ref: '#/components/schemas/ChatUsage'
        completed_at:
          type: string
          format: date-time

    ChatResponseCancelledEvent:
      type: object
      required: [state, request_id, cancelled_at]
      properties:
        state:
          $ref: '#/components/schemas/ChatSessionState'
        request_id:
          type: string
        cancelled_at:
          type: string
          format: date-time

    ChatRuntimeErrorEvent:
      type: object
      required: [session_id, message, fatal, occurred_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        message:
          type: string
        fatal:
          type: boolean
        occurred_at:
          type: string
          format: date-time

    ChatNotificationEvent:
      type: object
      required: [message, level, occurred_at]
      properties:
        message:
          type: string
        level:
          type: string
          enum: [info, warn, error]
        occurred_at:
          type: string
          format: date-time

    ExtensionsReloadedEvent:
      type: object
      required: [result, occurred_at]
      properties:
        result:
          $ref: '#/components/schemas/ExtensionReloadResult'
        occurred_at:
          type: string
          format: date-time

    ExtensionCommandsChangedEvent:
      type: object
      required: [commands, occurred_at]
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/ExtensionCommand'
        occurred_at:
          type: string
          format: date-time

    ExtensionCommandResultEvent:
      type: object
      required: [name, output, occurred_at]
      properties:
        name:
          type: string
        output:
          type: string
        occurred_at:
          type: string
          format: date-time

    InteractivePromptRequestedEvent:
      type: object
      required: [request_id, kind, title, message, requested_at]
      properties:
        request_id:
          type: string
        kind:
          $ref: '#/components/schemas/InteractivePromptKind'
        title:
          type: string
        message:
          type: string
        requested_at:
          type: string
          format: date-time

    SessionsListedEvent:
      type: object
      required: [sessions, occurred_at]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
        next_cursor:
          type: string
        occurred_at:
          type: string
          format: date-time

    SessionLoadedEvent:
      type: object
      required: [session_id, occurred_at]
      properties:
        session_id:
          type: string
        occurred_at:
          type: string
          format: date-time

    SessionDeletedEvent:
      type: object
      required: [session_id, occurred_at]
      properties:
        session_id:
          type: string
        occurred_at:
          type: string
          format: date-time

    SessionExportedEvent:
      type: object
      required: [session_id, path, occurred_at]
      properties:
        session_id:
          type: string
        path:
          type: string
        occurred_at:
          type: string
          format: date-time

    CommandsChangedEvent:
      type: object
      required: [commands, occurred_at]
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CommandRef'
        occurred_at:
          type: string
          format: date-time

    # ── ChatCommand payloads ──────────────────────────────────────────────────

    StartChatSessionCommand:
      type: object
      required: [session_id, config]
      properties:
        session_id:
          type: string
        config:
          $ref: '#/components/schemas/ChatSessionState'

    SubmitChatPromptCommand:
      type: object
      required: [session_id, request_id, prompt, submitted_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        prompt:
          type: string
        submitted_at:
          type: string
          format: date-time

    SteerChatPromptCommand:
      type: object
      required: [session_id, request_id, prompt, submitted_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        prompt:
          type: string
        submitted_at:
          type: string
          format: date-time

    UpdateChatSessionCommand:
      type: object
      required: [session_id, patch]
      properties:
        session_id:
          type: string
        patch:
          $ref: '#/components/schemas/ChatSessionPatch'

    CancelChatRequestCommand:
      type: object
      required: [session_id, requested_at]
      properties:
        session_id:
          type: string
        request_id:
          type: string
        requested_at:
          type: string
          format: date-time

    ResetChatSessionCommand:
      type: object
      required: [session_id, requested_at]
      properties:
        session_id:
          type: string
        requested_at:
          type: string
          format: date-time

    CloseChatSessionCommand:
      type: object
      required: [session_id, requested_at]
      properties:
        session_id:
          type: string
        requested_at:
          type: string
          format: date-time

    ReloadExtensionsCommand:
      type: object
      required: [requested_at]
      properties:
        requested_at:
          type: string
          format: date-time

    RunExtensionCommandCommand:
      type: object
      required: [name, requested_at]
      properties:
        name:
          type: string
        args:
          type: string
        requested_at:
          type: string
          format: date-time

    RespondInteractivePromptCommand:
      type: object
      required: [request_id, confirmed, canceled, responded_at]
      properties:
        request_id:
          type: string
        response:
          type: string
        confirmed:
          type: boolean
        canceled:
          type: boolean
        responded_at:
          type: string
          format: date-time

    ListSessionsCommand:
      type: object
      required: [limit]
      properties:
        limit:
          type: integer
        cursor:
          type: string

    LoadSessionCommand:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
        runtime_session_id:
          type: string

    DeleteSessionCommand:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string

    ExportSessionCommand:
      type: object
      required: [session_id, format]
      properties:
        session_id:
          type: string
        format:
          type: string
          enum: [jsonl, html]
        output:
          type: string
