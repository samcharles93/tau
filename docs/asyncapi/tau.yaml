# Code generated by tools/specgen from internal/bridge.EventTypes / CommandTypes.
# DO NOT EDIT the components.schemas section by hand - run `go -C tools run ./specgen`.
asyncapi: 3.0.0
channels:
    tauWebSocket:
        address: /ws
        messages:
            command:
                contentType: application/json
                name: ChatCommandEnvelope
                payload:
                    $ref: '#/components/schemas/ChatCommandEnvelope'
                title: Chat command
            error:
                contentType: application/json
                name: ErrorEnvelope
                payload:
                    $ref: '#/components/schemas/ErrorEnvelope'
                title: Protocol error
            event:
                contentType: application/json
                name: ChatEventEnvelope
                payload:
                    $ref: '#/components/schemas/ChatEventEnvelope'
                title: Chat event
            init:
                contentType: application/json
                name: InitMessage
                payload:
                    $ref: '#/components/schemas/InitMessage'
                title: Connection init
components:
    schemas:
        CancelChatRequestCommand:
            additionalProperties: false
            properties:
                request_id:
                    type: string
                requested_at:
                    format: date-time
                    type: string
                session_id:
                    type: string
            required:
                - session_id
                - requested_at
            type: object
        ChatCommandEnvelope:
            properties:
                payload:
                    oneOf:
                        - $ref: '#/components/schemas/CancelChatRequestCommand'
                        - $ref: '#/components/schemas/CloseChatSessionCommand'
                        - $ref: '#/components/schemas/DeleteSessionCommand'
                        - $ref: '#/components/schemas/ExportSessionCommand'
                        - $ref: '#/components/schemas/ListSessionsCommand'
                        - $ref: '#/components/schemas/ListSkillsCommand'
                        - $ref: '#/components/schemas/LoadChildTranscriptCommand'
                        - $ref: '#/components/schemas/LoadSessionCommand'
                        - $ref: '#/components/schemas/ReloadExtensionsCommand'
                        - $ref: '#/components/schemas/ReloadSkillsCommand'
                        - $ref: '#/components/schemas/ResetChatSessionCommand'
                        - $ref: '#/components/schemas/RespondInteractivePromptCommand'
                        - $ref: '#/components/schemas/RunAgentCommand'
                        - $ref: '#/components/schemas/RunExtensionCommandCommand'
                        - $ref: '#/components/schemas/RunSkillCommand'
                        - $ref: '#/components/schemas/StartChatSessionCommand'
                        - $ref: '#/components/schemas/SteerChatPromptCommand'
                        - $ref: '#/components/schemas/SubmitChatPromptCommand'
                        - $ref: '#/components/schemas/UpdateChatSessionCommand'
                type:
                    description: Concrete ChatCommand type name (e.g. SubmitChatPromptCommand).
                    type: string
            required:
                - type
                - payload
            type: object
        ChatEventEnvelope:
            properties:
                payload:
                    oneOf:
                        - $ref: '#/components/schemas/ChatNotificationEvent'
                        - $ref: '#/components/schemas/ChatReasoningDeltaEvent'
                        - $ref: '#/components/schemas/ChatResponseCancelledEvent'
                        - $ref: '#/components/schemas/ChatResponseCompletedEvent'
                        - $ref: '#/components/schemas/ChatResponseDeltaEvent'
                        - $ref: '#/components/schemas/ChatResponseStartedEvent'
                        - $ref: '#/components/schemas/ChatRuntimeErrorEvent'
                        - $ref: '#/components/schemas/ChatSessionSnapshotEvent'
                        - $ref: '#/components/schemas/ChatToolCallDeltaEvent'
                        - $ref: '#/components/schemas/ChatToolExecutionCompletedEvent'
                        - $ref: '#/components/schemas/ChatToolExecutionStartedEvent'
                        - $ref: '#/components/schemas/ChatToolOutputEvent'
                        - $ref: '#/components/schemas/ChildAgentMessageEvent'
                        - $ref: '#/components/schemas/ChildAgentStateEvent'
                        - $ref: '#/components/schemas/ChildTranscriptLoadedEvent'
                        - $ref: '#/components/schemas/CommandsChangedEvent'
                        - $ref: '#/components/schemas/ExtensionCommandResultEvent'
                        - $ref: '#/components/schemas/ExtensionCommandsChangedEvent'
                        - $ref: '#/components/schemas/ExtensionViewClosedEvent'
                        - $ref: '#/components/schemas/ExtensionViewRenderedEvent'
                        - $ref: '#/components/schemas/ExtensionsReloadedEvent'
                        - $ref: '#/components/schemas/InteractivePromptRequestedEvent'
                        - $ref: '#/components/schemas/SessionDeletedEvent'
                        - $ref: '#/components/schemas/SessionExportedEvent'
                        - $ref: '#/components/schemas/SessionLoadedEvent'
                        - $ref: '#/components/schemas/SessionsListedEvent'
                        - $ref: '#/components/schemas/SkillsChangedEvent'
                type:
                    description: Concrete ChatEvent type name (e.g. ChatResponseDeltaEvent).
                    type: string
            required:
                - type
                - payload
            type: object
        ChatFunctionCall:
            additionalProperties: false
            description: ChatFunctionCall is the function name + arguments within a tool call.
            properties:
                arguments:
                    description: JSON string
                    type: string
                name:
                    type: string
            required:
                - name
                - arguments
            type: object
        ChatMessage:
            additionalProperties: false
            description: ChatMessage is the canonical conversation item used for request history.
            properties:
                content:
                    type: string
                created_at:
                    description: |-
                        CreatedAt records when the message was appended to the conversation.
                        It is zero for the transient system message synthesised in
                        RequestMessages and for messages persisted before per-message
                        timestamps were tracked (the store falls back to a synthesised time).
                    format: date-time
                    type: string
                id:
                    description: |-
                        ID identifies this message across the TUI, WebUI, and persisted
                        storage - e.g. so a client can address a specific message (a
                        right-click context menu action, a future edit/delete). It is empty
                        for the transient system message synthesised in RequestMessages
                        (never persisted or rendered) and for messages persisted before
                        per-message IDs were tracked; callers must treat "" as "no stable
                        identity available" rather than assuming it's always populated.
                    type: string
                reasoning_content:
                    type: string
                role:
                    type: string
                tool_call_id:
                    type: string
                tool_calls:
                    items:
                        $ref: '#/components/schemas/ChatToolCall'
                    type: array
                tool_result:
                    $ref: '#/components/schemas/ToolResultMetadata'
            required:
                - role
            type: object
        ChatModelRef:
            additionalProperties: false
            description: ChatModelRef identifies the selected model route for a session.
            properties:
                id:
                    type: string
                provider:
                    type: string
                url:
                    type: string
            required:
                - id
                - url
            type: object
        ChatNotificationEvent:
            additionalProperties: false
            properties:
                level:
                    type: string
                message:
                    type: string
                occurred_at:
                    format: date-time
                    type: string
            required:
                - message
                - level
                - occurred_at
            type: object
        ChatParameters:
            additionalProperties: false
            description: ChatParameters are the tunable per-request controls for a session.
            properties:
                max_tokens:
                    type: integer
                reasoning_effort:
                    type: string
                temperature:
                    type: number
            required:
                - max_tokens
                - temperature
            type: object
        ChatReasoningDeltaEvent:
            additionalProperties: false
            properties:
                delta:
                    type: string
                received_at:
                    format: date-time
                    type: string
                request_id:
                    type: string
                session_id:
                    type: string
                snapshot:
                    type: string
            required:
                - session_id
                - request_id
                - delta
                - snapshot
                - received_at
            type: object
        ChatResponseCancelledEvent:
            additionalProperties: false
            properties:
                cancelled_at:
                    format: date-time
                    type: string
                request_id:
                    type: string
                state:
                    $ref: '#/components/schemas/ChatSessionState'
            required:
                - state
                - request_id
                - cancelled_at
            type: object
        ChatResponseCompletedEvent:
            additionalProperties: false
            properties:
                budget_exhausted:
                    description: |-
                        BudgetExhausted is true when the turn ended due to max-turns or
                        max-tokens budget exhaustion (per-task limit, per P2.4).
                    type: boolean
                completed_at:
                    format: date-time
                    type: string
                cumulative_cost:
                    description: CumulativeCost is the total USD cost of all iterations in this turn.
                    type: number
                cumulative_usage:
                    $ref: '#/components/schemas/ChatUsage'
                    description: |-
                        CumulativeUsage carries aggregate token usage across all iterations
                        within this turn, not just the last model call.
                finish_reason:
                    type: string
                partial:
                    description: |-
                        Partial is true when the response contains best-effort partial output
                        from a limit-breached turn.
                    type: boolean
                request_id:
                    type: string
                state:
                    $ref: '#/components/schemas/ChatSessionState'
                timed_out:
                    description: |-
                        TimedOut is true when the turn ended due to a wall-clock deadline
                        or timeout (per-task limit, per P2.4).
                    type: boolean
                turn_iterations:
                    description: |-
                        TurnIterations is the number of model iterations executed in this
                        turn (the tool-call loop count). 1 means no tools were called.
                    type: integer
                usage:
                    $ref: '#/components/schemas/ChatUsage'
            required:
                - state
                - request_id
                - finish_reason
                - usage
                - completed_at
                - turn_iterations
                - cumulative_usage
                - cumulative_cost
            type: object
        ChatResponseDeltaEvent:
            additionalProperties: false
            properties:
                delta:
                    type: string
                received_at:
                    format: date-time
                    type: string
                request_id:
                    type: string
                session_id:
                    type: string
                snapshot:
                    type: string
            required:
                - session_id
                - request_id
                - delta
                - snapshot
                - received_at
            type: object
        ChatResponseStartedEvent:
            additionalProperties: false
            properties:
                request_id:
                    type: string
                session_id:
                    type: string
                started_at:
                    format: date-time
                    type: string
            required:
                - session_id
                - request_id
                - started_at
            type: object
        ChatRuntimeErrorEvent:
            additionalProperties: false
            properties:
                fatal:
                    type: boolean
                message:
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                request_id:
                    type: string
                session_id:
                    type: string
            required:
                - session_id
                - message
                - fatal
                - occurred_at
            type: object
        ChatSessionConfig:
            additionalProperties: false
            description: ChatSessionConfig is the immutable setup for a newly created session.
            properties:
                agent_instance_id:
                    description: |-
                        AgentInstanceID links this session to the agent instance that ran it.
                        Empty for pre-migration sessions. Immutable after creation.
                    type: string
                model:
                    $ref: '#/components/schemas/ChatModelRef'
                parameters:
                    $ref: '#/components/schemas/ChatParameters'
                parent_session_id:
                    description: |-
                        ParentSessionID links this session to its parent for conversation
                        branching / traceability. Empty string means this is a root session.
                        The relationship is immutable after session creation.
                    type: string
                system_prompt:
                    type: string
            required:
                - model
                - system_prompt
                - parameters
            type: object
        ChatSessionPatch:
            additionalProperties: false
            description: ChatSessionPatch holds optional config changes for an existing session.
            properties:
                max_tokens:
                    type: integer
                model:
                    $ref: '#/components/schemas/ChatModelRef'
                provider:
                    type: string
                reasoning_effort:
                    type: string
                system_prompt:
                    type: string
                temperature:
                    type: number
            type: object
        ChatSessionSnapshotEvent:
            additionalProperties: false
            properties:
                state:
                    $ref: '#/components/schemas/ChatSessionState'
            required:
                - state
            type: object
        ChatSessionState:
            additionalProperties: false
            description: ChatSessionState is the runtime-owned mutable state for one conversation.
            properties:
                active_request_id:
                    type: string
                agent_instance_id:
                    description: |-
                        AgentInstanceID links this session to the agent instance that ran it.
                        Empty for pre-migration sessions. Immutable after creation.
                    type: string
                created_at:
                    format: date-time
                    type: string
                last_error:
                    type: string
                last_finish_reason:
                    type: string
                last_usage:
                    $ref: '#/components/schemas/ChatUsage'
                messages:
                    items:
                        $ref: '#/components/schemas/ChatMessage'
                    type: array
                model:
                    $ref: '#/components/schemas/ChatModelRef'
                parameters:
                    $ref: '#/components/schemas/ChatParameters'
                parent_session_id:
                    description: |-
                        ParentSessionID links this session to its parent for conversation
                        branching / traceability. Empty means root session. Immutable after creation.
                    type: string
                pending_assistant:
                    type: string
                provider:
                    description: |-
                        ProviderName mirrors Provider.Name and is the field consumed by wire
                        consumers (web UI, bridge) to know which provider is active.
                    type: string
                session_id:
                    type: string
                status:
                    type: string
                system_prompt:
                    type: string
                tools:
                    items:
                        $ref: '#/components/schemas/ChatToolDef'
                    type: array
                updated_at:
                    format: date-time
                    type: string
            required:
                - session_id
                - model
                - system_prompt
                - parameters
                - status
                - messages
                - last_usage
                - created_at
                - updated_at
            type: object
        ChatToolCall:
            additionalProperties: false
            description: ChatToolCall is an OpenAI-compatible tool call from the assistant.
            properties:
                function:
                    $ref: '#/components/schemas/ChatFunctionCall'
                id:
                    type: string
                type:
                    description: always "function"
                    type: string
            required:
                - id
                - type
                - function
            type: object
        ChatToolCallDeltaEvent:
            additionalProperties: false
            properties:
                arguments_summary:
                    type: string
                call_id:
                    type: string
                index:
                    type: integer
                received_at:
                    format: date-time
                    type: string
                request_id:
                    type: string
                session_id:
                    type: string
                tool_name:
                    type: string
                truncated:
                    type: boolean
            required:
                - session_id
                - request_id
                - call_id
                - index
                - tool_name
                - arguments_summary
                - truncated
                - received_at
            type: object
        ChatToolDef:
            additionalProperties: false
            description: ChatToolDef is the OpenAI function-calling tool definition sent in requests.
            properties:
                function:
                    $ref: '#/components/schemas/ChatToolDefFunction'
                type:
                    description: '"function"'
                    type: string
            required:
                - type
                - function
            type: object
        ChatToolDefFunction:
            additionalProperties: false
            description: ChatToolDefFunction describes one function tool for the API request.
            properties:
                description:
                    type: string
                name:
                    type: string
                parameters:
                    description: JSON Schema
            required:
                - name
                - description
                - parameters
            type: object
        ChatToolExecutionCompletedEvent:
            additionalProperties: false
            properties:
                call_id:
                    type: string
                completed_at:
                    format: date-time
                    type: string
                details:
                    description: |-
                        Details carries tool-specific structured data (e.g.
                        tools.DiffDetails for edit/write) alongside the plain-text summary,
                        so consumers like the TUI can render richer views. nil when the tool
                        has nothing structured to offer.
                duration:
                    type: integer
                is_error:
                    type: boolean
                request_id:
                    type: string
                result_summary:
                    type: string
                session_id:
                    type: string
                status:
                    type: string
                tool_name:
                    type: string
                truncated:
                    type: boolean
            required:
                - session_id
                - request_id
                - call_id
                - tool_name
                - status
                - duration
                - result_summary
                - is_error
                - truncated
                - completed_at
            type: object
        ChatToolExecutionStartedEvent:
            additionalProperties: false
            properties:
                arguments_summary:
                    type: string
                call_id:
                    type: string
                request_id:
                    type: string
                session_id:
                    type: string
                started_at:
                    format: date-time
                    type: string
                summary:
                    description: |-
                        Summary is a short, model-authored one-liner describing what this
                        call is doing (e.g. "Checking installed packages"), sourced from an
                        optional "summary" argument injected into every tool's schema. Empty
                        when the model didn't supply one - never populated with anything
                        that failed sanitization, so consumers can render it as-is.
                    type: string
                tool_name:
                    type: string
            required:
                - session_id
                - request_id
                - call_id
                - tool_name
                - arguments_summary
                - started_at
            type: object
        ChatToolOutputEvent:
            additionalProperties: false
            properties:
                call_id:
                    type: string
                chunk:
                    type: string
                received_at:
                    format: date-time
                    type: string
                request_id:
                    type: string
                session_id:
                    type: string
            required:
                - session_id
                - request_id
                - call_id
                - chunk
                - received_at
            type: object
        ChatUsage:
            additionalProperties: false
            description: ChatUsage stores token counts surfaced by the backend.
            properties:
                cache_creation_tokens:
                    description: |-
                        CacheCreationTokens is Anthropic-specific: tokens written to the
                        cache on this call, billed at a premium over normal input tokens.
                    type: integer
                cached_tokens:
                    description: |-
                        CachedTokens is the portion of PromptTokens served from a provider
                        cache (OpenAI's automatic prefix cache, or an Anthropic cache_control
                        read), billed at a reduced rate. Zero when the provider didn't
                        report it or nothing was served from cache.
                    type: integer
                completion_tokens:
                    type: integer
                output_tokens:
                    type: integer
                prompt_tokens:
                    type: integer
                total_tokens:
                    type: integer
            type: object
        ChildAgentMessageEvent:
            additionalProperties: false
            description: ChildAgentMessageEvent forwards a child agent's inner chat event to the parent bus so the TUI/WebUI can render a live transcript for a running child, mirroring the events the child's own session would emit.
            properties:
                call_id:
                    type: string
                event: true
                instance_id:
                    type: string
            required:
                - instance_id
                - call_id
                - event
            type: object
        ChildAgentStateEvent:
            additionalProperties: false
            description: ChildAgentStateEvent is published on the parent bus when an agent-scoped event or usage update arrives from a spawned child.
            properties:
                activity:
                    description: '"thinking" or tool verb + argument'
                    type: string
                call_id:
                    description: spawning agent tool call id
                    type: string
                elapsed_ms:
                    description: wall clock since spawn
                    type: integer
                error:
                    type: string
                input_tokens:
                    description: cumulative from agent.usage
                    type: integer
                instance_id:
                    description: child instance, e.g. "research#k3v9qp"
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                output_tokens:
                    description: cumulative from agent.usage
                    type: integer
                partial:
                    type: boolean
                spec_name:
                    description: e.g. "research"
                    type: string
                status:
                    type: string
                turns:
                    description: from agent.usage
                    type: integer
            required:
                - instance_id
                - call_id
                - spec_name
                - activity
                - turns
                - input_tokens
                - output_tokens
                - elapsed_ms
                - status
                - occurred_at
            type: object
        ChildTranscriptLoadedEvent:
            additionalProperties: false
            description: ChildTranscriptLoadedEvent carries a finished child agent's message history for read-only drill-down.
            properties:
                messages:
                    items:
                        $ref: '#/components/schemas/ChatMessage'
                    type: array
                session_id:
                    type: string
            required:
                - session_id
                - messages
            type: object
        CloseChatSessionCommand:
            additionalProperties: false
            properties:
                requested_at:
                    format: date-time
                    type: string
                session_id:
                    type: string
            required:
                - session_id
                - requested_at
            type: object
        CommandRef:
            additionalProperties: false
            description: CommandRef is a lightweight command descriptor published by the registry so that consumers (TUI, etc.) can render completions without importing the full registry package.
            properties:
                accepts_args:
                    type: boolean
                description:
                    type: string
                label:
                    type: string
                name:
                    type: string
            required:
                - name
                - label
            type: object
        CommandsChangedEvent:
            additionalProperties: false
            description: CommandsChangedEvent is published by the command registry whenever the set of available non-extension commands changes (startup, reload, etc.).
            properties:
                commands:
                    items:
                        $ref: '#/components/schemas/CommandRef'
                    type: array
                occurred_at:
                    format: date-time
                    type: string
            required:
                - commands
                - occurred_at
            type: object
        DeleteSessionCommand:
            additionalProperties: false
            description: DeleteSessionCommand deletes a saved session and its messages.
            properties:
                session_id:
                    type: string
            required:
                - session_id
            type: object
        DividerWidget:
            additionalProperties: false
            properties:
                label:
                    type: string
            type: object
        ErrorEnvelope:
            properties:
                payload:
                    description: Human-readable error message.
                    type: string
                type:
                    const: error
                    type: string
            required:
                - type
                - payload
            type: object
        ExportSessionCommand:
            additionalProperties: false
            description: ExportSessionCommand exports a session to a file or stdout.
            properties:
                format:
                    description: '"jsonl" or "html"'
                    type: string
                output:
                    description: file path, empty = stdout
                    type: string
                session_id:
                    type: string
            required:
                - session_id
                - format
            type: object
        ExtensionCommand:
            additionalProperties: false
            properties:
                args_hint:
                    description: ArgsHint is an optional usage hint shown in completions, e.g. "<server>".
                    type: string
                description:
                    type: string
                extension_name:
                    type: string
                name:
                    type: string
                subcommands:
                    description: |-
                        Subcommands are nested sub-actions of this command, e.g. list / reconnect
                        / reload under an `mcp` group. Empty for flat commands.
                    items:
                        $ref: '#/components/schemas/ExtensionCommand'
                    type: array
            required:
                - name
            type: object
        ExtensionCommandResultEvent:
            additionalProperties: false
            properties:
                name:
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                output:
                    type: string
                view:
                    $ref: '#/components/schemas/ExtensionView'
            required:
                - name
                - output
                - occurred_at
            type: object
        ExtensionCommandsChangedEvent:
            additionalProperties: false
            properties:
                commands:
                    items:
                        $ref: '#/components/schemas/ExtensionCommand'
                    type: array
                occurred_at:
                    format: date-time
                    type: string
            required:
                - commands
                - occurred_at
            type: object
        ExtensionDiagnostic:
            additionalProperties: false
            properties:
                extension_name:
                    type: string
                message:
                    type: string
                path:
                    type: string
                severity:
                    type: string
            required:
                - severity
                - message
            type: object
        ExtensionReloadResult:
            additionalProperties: false
            properties:
                commands:
                    items:
                        $ref: '#/components/schemas/ExtensionCommand'
                    type: array
                diagnostics:
                    items:
                        $ref: '#/components/schemas/ExtensionDiagnostic'
                    type: array
                extension_count:
                    type: integer
            required:
                - extension_count
            type: object
        ExtensionView:
            additionalProperties: false
            description: ExtensionView is a structured panel a plugin renders into the host UI, either attached to a command result (sync) or pushed independently via ExtensionViewRenderedEvent (async).
            properties:
                id:
                    type: string
                style:
                    $ref: '#/components/schemas/Style'
                title:
                    type: string
                widgets:
                    items:
                        $ref: '#/components/schemas/Widget'
                    type: array
            required:
                - id
            type: object
        ExtensionViewClosedEvent:
            additionalProperties: false
            description: ExtensionViewClosedEvent is published when a plugin closes a panel via Host.CloseView, or when the host closes it on the plugin's behalf (unload/reload).
            properties:
                occurred_at:
                    format: date-time
                    type: string
                plugin_name:
                    type: string
                view_id:
                    type: string
            required:
                - plugin_name
                - view_id
                - occurred_at
            type: object
        ExtensionViewRenderedEvent:
            additionalProperties: false
            description: ExtensionViewRenderedEvent is published when a plugin opens or updates a persistent panel via Host.RenderView.
            properties:
                occurred_at:
                    format: date-time
                    type: string
                plugin_name:
                    type: string
                view:
                    $ref: '#/components/schemas/ExtensionView'
                view_id:
                    type: string
            required:
                - plugin_name
                - view_id
                - view
                - occurred_at
            type: object
        ExtensionsReloadedEvent:
            additionalProperties: false
            properties:
                occurred_at:
                    format: date-time
                    type: string
                result:
                    $ref: '#/components/schemas/ExtensionReloadResult'
            required:
                - result
                - occurred_at
            type: object
        InitMessage:
            additionalProperties: false
            properties:
                commands:
                    items:
                        $ref: '#/components/schemas/CommandRef'
                    type: array
                extension_commands:
                    items:
                        $ref: '#/components/schemas/ExtensionCommand'
                    type: array
                model:
                    type: string
                models:
                    items:
                        $ref: '#/components/schemas/ChatModelRef'
                    type: array
                provider:
                    type: string
                providers:
                    items:
                        type: string
                    type: array
                session_id:
                    type: string
                skills:
                    items:
