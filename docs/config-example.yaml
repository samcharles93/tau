# Tau configuration example.
# Copy to ~/.config/tau/config.yaml for global use, or .tau.yaml in a project.
#
# Most model metadata (context window, pricing, reasoning capabilities) is
# loaded from the embedded offline snapshot — you do not need to repeat it
# here. Only specify auth and optional overrides.
#
# Well-known providers are auto-detected when their API key env var is set.
# See docs/ai-sdk.md for the full provider list and integration details.

# Default provider and model used when no --provider / --model flag is passed.
default_provider: openrouter
default_model: deepseek/deepseek-chat-v3-0324

providers:
  # OpenAI-compatible provider (standard pattern)
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    auth:
      type: api_key
      api_key_env: OPENROUTER_API_KEY

  # Provider with no API key (e.g. local Ollama server)
  - name: ollama
    base_url: http://localhost:11434/v1
    auth:
      type: none

  # Anthropic uses the native Messages API (not OpenAI-compatible).
  # type: anthropic is required. base_url must be the host only — no /v1.
  - name: anthropic
    base_url: https://api.anthropic.com
    type: anthropic
    auth:
      type: api_key
      api_key_env: ANTHROPIC_API_KEY

  # Custom / self-hosted endpoint
  - name: my-provider
    base_url: https://llm.example.com/v1
    auth:
      type: api_key
      api_key_env: MY_PROVIDER_API_KEY

ui:
  show_reasoning: true   # Display model reasoning content (default: false)

# Path to your plugin binaries directory (optional)
# plugins_dir: ~/.config/tau/plugins
