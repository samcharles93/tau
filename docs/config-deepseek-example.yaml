# DeepSeek configuration example.
# Copy to .tau.yaml in your project, or merge into ~/.config/tau/config.yaml.
#
# Set DEEPSEEK_API_KEY in your environment — tau auto-detects it, so you can
# run `tau` without any config file at all once the key is exported.
#
# Model metadata (context window, reasoning, pricing) comes from the embedded
# snapshot. The minimal config below is all you need.

default_provider: deepseek
default_model: deepseek-chat

providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    auth:
      type: api_key
      api_key_env: DEEPSEEK_API_KEY

# Optional: show model reasoning tokens in the TUI
ui:
  show_reasoning: true
