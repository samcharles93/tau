name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths:
      - "install.ps1"
      - "install.tests.ps1"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows-installer-test:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser

      # Run under Windows PowerShell (5.1): the test fixtures compile C#
      # fixtures via Add-Type -OutputType ConsoleApplication, which
      # PowerShell 7 (pwsh) does not support (PSNotSupportedException).
      - name: Run install.ps1 Pester tests
        shell: powershell
        run: Invoke-Pester -Path ./install.tests.ps1

  goreleaser:
    needs: [release-please, windows-installer-test]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: internal/webui/pnpm-lock.yaml

      - name: Run tests
        run: go test ./...

      # Dry-run goreleaser (build + archive + checksum, skip publish) so a
      # misconfigured platform matrix fails CI before anything is uploaded.
      - name: goreleaser dry-run
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release asset matrix
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: go run ./scripts/verify-release-assets --dist dist --tag "$TAG_NAME"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          rm -rf live-release && mkdir live-release
          gh release download "$TAG_NAME" --dir live-release --repo samcharles93/tau
          go run ./scripts/verify-release-assets --dist live-release --tag "$TAG_NAME"
