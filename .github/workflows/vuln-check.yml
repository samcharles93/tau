name: Vulnerability Scan

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:      # Allow manual triggering

permissions:
  issues: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'
          output-format: 'json'
          output-file: 'vuln.json'
          repo-checkout: false

      - name: Create GitHub Issues for Vulnerabilities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # If the file is empty or missing, exit
          if [ ! -f vuln.json ] || [ ! -s vuln.json ]; then
            echo "No vulnerabilities detected."
            exit 0
          fi

          # Extract unique OSV IDs that actually have code-level findings
          VULN_IDS=$(jq -r 'select(.finding != null) | .finding.osv' vuln.json | sort -u)

          if [ -z "$VULN_IDS" ]; then
            echo "No code-level vulnerabilities detected."
            exit 0
          fi

          for id in $VULN_IDS; do
            # Check if GitHub issue already exists for this vulnerability
            EXISTING_ISSUE=$(gh issue list --search "[$id]" --json number --jq '.[0].number')
            if [ -n "$EXISTING_ISSUE" ]; then
              echo "Issue for $id already exists: #$EXISTING_ISSUE. Skipping."
              continue
            fi

            # Extract summary
            SUMMARY=$(jq -r --arg id "$id" 'select(.osv != null and .osv.id == $id) | .osv.summary' vuln.json | head -n 1)

            # Build detailed issue body using jq
            BODY=$(jq -r -s --arg id "$id" '
              (map(select(.osv != null and .osv.id == $id))[0].osv) as $osv |
              [
                "## Vulnerability details: [" + $id + "](https://pkg.go.dev/vuln/" + $id + ")",
                "",
                $osv.details,
                "",
                "### Call Traces / Findings"
              ] + [
                map(select(.finding != null and .finding.osv == $id))[] |
                "#### Trace:",
                (.finding.trace | map("- `\(.function)`" + (if .position then " in `\(.position.filename):\(.position.line)`" else "" end))[],
                ""
              ] | join("\n")
            ' vuln.json)

            # Create GitHub issue
            gh issue create \
              --title "[$id] $SUMMARY" \
              --body "$BODY" \
              --label "security,vulnerability"
          done
