name: Release please

on:
  push:
    branches:
      - master

# release-please opens the release PR, bumps VERSION + CHANGELOG, and on
# merge creates the tag + Gitea release. goreleaser then fires on the
# tag push (see release.yml) and attaches binaries to that release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # On Gitea, git over HTTPS requires explicit auth.
      # The release-please-action handles API auth via the `token`
      # input, but its internal git clone needs git credentials.
      # Using `url.insteadOf` rewrites HTTPS URLs to include the PAT
      # for our Gitea instance only (doesn't affect github.com fetches).
      - name: Configure git for Gitea
        run: |
          git config --global "http.https://git.catlow.cloud/.extraheader" "Authorization: token ${{ secrets.RELEASE_TOKEN }}"
      - id: release
        # Gitea-native fork of release-please-action: same inputs/outputs
        # as googleapis/release-please-action, but uses the Gitea API
        # backend instead of api.github.com. Full URL form so Gitea's
        # act_runner fetches the action from github.com unambiguously.
        uses: https://github.com/joaquinjsb/gitea-release-please-action@v4
        with:
          # Manifest strategy: per-package config (release-type,
          # package-name, version-file, tag shape) lives in
          # release-please-config.json; the current version per path
          # lives in .release-please-manifest.json.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN }}
          repo-url: sam/tau
          github-api-url: https://git.catlow.cloud/api/v1