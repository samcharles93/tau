name: Release please

on:
  push:
    branches:
      - master

# release-please opens the release PR, pushes the version bump commit,
# and creates the tag + GitHub release on merge. goreleaser then fires
# on the tag (see release.yml) and attaches binaries to that release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Manifest strategy: per-package config (release-type,
          # package-name, extra-files, tag shape) lives in
          # release-please-config.json; the current version per path
          # lives in .release-please-manifest.json. v4 of the action
          # does not accept package-name/extra-files as direct inputs.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}