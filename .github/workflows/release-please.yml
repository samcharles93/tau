name: Release please

on:
  push:
    branches:
      - master

# release-please opens the release PR, pushes the version bump commit,
# and creates the tag + GitHub release on merge. goreleaser then fires
# on the tag (see release.yml) and attaches binaries to that release.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Go release type: version is sourced from git tags (v-prefixed);
          # there is no go.mod version field to bump.
          release-type: go
          package-name: tau
          # Tags are `v0.5.2`, not `tau-v0.5.2`.
          include-component-in-tag: false
          # Bump the VERSION file alongside CHANGELOG.md on each release
          # so the canonical version is visible in the tree.
          extra-files: |
            VERSION
          token: ${{ secrets.GITHUB_TOKEN }}