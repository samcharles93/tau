version: "3"

vars:
  BINARY: tau
  CMD: ./cmd/tau
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: Build the web UI and the binary
    deps:
      - webui
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.BINARY}}{{exeExt}} {{.CMD}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}{{exeExt}}"

  webui:
    desc: Build the Tau Web UI SPA into internal/spa/dist
    dir: internal/webui
    cmds:
      - pnpm install --prefer-offline
      - pnpm build
    sources:
      - "src/**/*.vue"
      - "src/**/*.ts"
      - "src/**/*.css"
      - index.html
      - vite.config.ts
      - tsconfig.json
      - package.json
    generates:
      - ../spa/dist/index.html

  plugins:
    desc: Build all example plugins into their directories
    cmds:
      - for: [hello]
        cmd: cd examples/plugins/{{.ITEM}} && go mod tidy && go build -o tau-plugin-{{.ITEM}} .

  plugins:install:
    desc: Build all example plugins and copy them to ~/.config/tau/plugins
    deps:
      - plugins
    cmds:
      - mkdir -p ~/.config/tau/plugins
      - for: [hello]
        cmd: cp examples/plugins/{{.ITEM}}/tau-plugin-{{.ITEM}} ~/.config/tau/plugins/

  deadcode:
    desc: Detect dead code in production packages (exclude *_test.go)
    cmds:
      - golangci-lint run --tests=false --enable-only=unused,staticcheck ./...

  check:
    desc: Run all quality checks (format, lint, vet, fix, test)
    cmds:
      - golangci-lint fmt ./...
      - go vet ./...
      - go fix ./...
      - golangci-lint run ./...
      - go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  build:all:
    desc: Cross-compile for all release targets
    cmds:
      - task: build:darwin-amd64
      - task: build:darwin-arm64
      - task: build:windows-amd64

  build:darwin-amd64:
    desc: Build for macOS (Intel)
    env:
      GOOS: darwin
      GOARCH: amd64
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o dist/{{.BINARY}}-darwin-amd64 {{.CMD}}

  build:darwin-arm64:
    desc: Build for macOS (Apple Silicon)
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o dist/{{.BINARY}}-darwin-arm64 {{.CMD}}

  build:windows-amd64:
    desc: Build for Windows
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o dist/{{.BINARY}}-windows-amd64.exe {{.CMD}}

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}{{exeExt}}
      - rm -rf dist/

  install:
    desc: Install tau to $GOPATH/bin
    cmds:
      - go install -ldflags "-s -w -X main.version={{.VERSION}}" {{.CMD}}
