version: "3"

vars:
  BINARY: tau
  CMD: ./cmd/tau
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown

tasks:
  default:
    desc: Build the Go binary
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o {{.BINARY}}{{exeExt}} {{.CMD}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}{{exeExt}}"

  all:
    desc: Build the web UI SPA and the Go binary (full build)
    cmds:
      - cd internal/webui && pnpm install --prefer-offline && pnpm build
      - go build -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o {{.BINARY}}{{exeExt}} {{.CMD}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - internal/webui/src/**/*.vue
      - internal/webui/src/**/*.ts
      - internal/webui/src/**/*.css
      - internal/webui/index.html
      - internal/webui/vite.config.ts
      - internal/webui/tsconfig.json
      - internal/webui/package.json
    generates:
      - "{{.BINARY}}{{exeExt}}"
      - internal/spa/dist/index.html

  test:webui:
    desc: Run the Web UI unit tests (Vitest)
    dir: internal/webui
    cmds:
      - pnpm install --prefer-offline
      - pnpm test

  check:webui:
    desc: Run Web UI quality checks (test and build type-check)
    dir: internal/webui
    deps:
      - test:webui
    cmds:
      - pnpm build

  specgen:
    desc: Regenerate docs/asyncapi/tau.yaml from internal/bridge's wire type registries
    dir: tools
    cmds:
      - go run ./specgen
    sources:
      - ../internal/bridge/wire.go
      - ../internal/chat/types.go
      - specgen/main.go
      - ../docs/asyncapi/header.yaml
    generates:
      - ../docs/asyncapi/tau.yaml

  docs:dev:
    desc: Serve the docs site locally with live reload
    dir: docs
    cmds:
      - pnpm install --prefer-offline
      - pnpm dev

  docs:build:
    desc: Build the docs site (VitePress) into docs/.vitepress/dist
    dir: docs
    cmds:
      - pnpm install --prefer-offline
      - pnpm build
    sources:
      - "*.md"
      - "*/*.md"
      - "*/*.yaml"
      - ".vitepress/config.mts"
      - package.json
    generates:
      - .vitepress/dist/index.html

  plugins:
    desc: Build all example plugins into their directories
    cmds:
      - for: [hello]
        cmd: cd examples/plugins/{{.ITEM}} && go mod tidy && go build -o tau-plugin-{{.ITEM}} .

  plugins:install:
    desc: Build all example plugins and copy them to the plugins directory
    deps:
      - plugins
    cmds:
      - mkdir -p $(go run ./cmd/tau config-dir)/plugins
      - for: [hello]
        cmd: cp examples/plugins/{{.ITEM}}/tau-plugin-{{.ITEM}} $(go run ./cmd/tau config-dir)/plugins/

  deadcode:
    desc: Detect dead code in production packages (exclude *_test.go)
    cmds:
      - golangci-lint run --tests=false --enable-only=unused,staticcheck ./...

  tool-stats:
    desc: Analyse tau sessions and report per-tool usage, tokens, and error rates
    cmds:
      - go run ./scripts/tool-stats {{.CLI_ARGS}}

  check:windows:
    desc: Run formatting and modernization on Windows-only files
    env:
      GOOS: windows
    cmds:
      - gofumpt -w .
      - go fix ./...
      - gofumpt -w .

  check:
    desc: Run all quality checks (format, lint, vet, fix, test) for all platforms
    deps:
      - check:windows
    cmds:
      - go vet ./...
      - go fix ./...
      - gofumpt -w .
      - golangci-lint run ./...
      - go test ./... ./tools/... ./plugins/mcp/... ./examples/plugins/hello/...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./... ./tools/... ./plugins/mcp/... ./examples/plugins/hello/...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}{{exeExt}}
      - rm -rf dist/

  install:
    desc: Install tau to $GOPATH/bin
    cmds:
      - go install -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" {{.CMD}}

  setup:
    desc: Setup the required dependencies
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@latest
      - go install mvdan.cc/gofumpt@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/go-delve/delve/cmd/dlv@latest
