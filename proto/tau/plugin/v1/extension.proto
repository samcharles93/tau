// tau plugin wire contract.
//
// This file is the source of truth for the host<->plugin protocol. Both the
// tau host and every plugin binary compile against the Go code generated from
// it (pkg/plugin/api). Regenerate with `task proto`.
//
// Compatibility policy:
//   - Field, enum, and oneof numbers are append-only: never renumber or reuse
//     one. When removing a field, reserve its number and name.
//   - Evolve additively. Hosts skip unknown Widget/EventPayload kinds and
//     ignore unknown capability strings; plugins must tolerate absent fields
//     and Unimplemented host RPCs.
//   - A deliberate breaking change (package rename, field type change, enum
//     renumbering) must bump ProtocolVersion in api.Handshake so stale plugin
//     binaries are rejected at handshake instead of failing mid-call.
syntax = "proto3";

package tau.plugin.v1;

option go_package = "github.com/samcharles93/tau/pkg/plugin/api;api";

// --- Shared types ---

// Command represents an extension slash command. Commands may declare nested
// sub-actions (subcommands), e.g. `/mcp list`, so a plugin can group related
// actions under a single namespace instead of hyphenated top-level commands.
message Command {
  string name = 1;
  string description = 2;
  string extension_name = 3;
  repeated Command subcommands = 4; // sub-actions, e.g. list / reconnect / reload
  string args_hint = 5;             // optional usage hint, e.g. "<server>"
}

// Diagnostic represents an extension diagnostic message.
message Diagnostic {
  string path = 1;
  string extension_name = 2;
  string severity = 3;  // "info", "warn", or "error"
  string message = 4;
}

// --- Metadata ---

message GetMetadataRequest {}
message GetMetadataResponse {
  string name = 1;
  repeated Command commands = 2;
  string docs = 3;  // optional markdown documentation the plugin ships, see Documented
}

// --- Commands ---

message RunCommandRequest {
  string name = 1;
  // The raw argument text following the command name, unsplit. The plugin is
  // responsible for its own tokenising and quoting rules.
  string args = 2;
}
message RunCommandResponse {
  string output = 1;
  View view = 2;
}

// --- Reload ---

message ReloadRequest {}
message ReloadResponse {
  repeated Diagnostic diagnostics = 1;
  repeated Command commands = 2;
}

// --- Events ---

// DispatchEventRequest delivers one runtime event to a plugin. `event` is the
// authoritative discriminator; `payload` carries the matching typed data.
//
// Request-response events (the host applies the returned EventResponse):
//   "context"          -> ContextPayload
//   "before_llm_call"  -> BeforeLLMCallPayload
//   "before_tool_exec" -> ToolCallPayload
//   "after_tool_exec"  -> ToolResultPayload
//
// Fire-and-forget lifecycle events (any returned EventResponse is ignored):
//   "session_start", "session_shutdown"          -> SessionEventPayload
//   "turn_start", "turn_end"                     -> TurnPayload
//   "after_llm_call"                             -> AfterLLMCallPayload
//   "tool_execution_start"                       -> ToolCallPayload
//   "tool_execution_end"                         -> ToolResultPayload
//
// New event names may be added at any time; plugins must ignore events they
// do not recognise.
message DispatchEventRequest {
  string event = 1;
  string session_id = 2;
  EventPayload payload = 3;
}

message DispatchEventResponse {
  EventResponse response = 1;
}

// EventPayload carries typed data for each event kind. Unknown kinds are
// skipped, so new payload types can be added additively.
message EventPayload {
  // 7 was message_delta, 9 was compaction: declared but never dispatched by
  // any host; removed 2026-07. Re-add only alongside a host that dispatches
  // them.
  reserved 7, 9;
  reserved "message_delta", "compaction";

  oneof kind {
    SessionEventPayload session = 1;
    ContextPayload context = 2;
    BeforeLLMCallPayload before_llm_call = 3;
    AfterLLMCallPayload after_llm_call = 4;
    ToolCallPayload before_tool_exec = 5;
    ToolResultPayload after_tool_exec = 6;
    TurnPayload turn = 8;
  }
}

// EventResponse is what plugins return from request-response events to modify
// host behaviour. Responses from multiple plugins are merged in plugin load
// order: repeated fields append, add_headers map-merges (later plugins win on
// key conflicts), inject_system_prompt values are newline-joined, boolean
// flags OR together (the first blocking plugin's block_reason is kept), and
// for the modified_* fields the last plugin to set a non-empty value wins.
//
// The modified_* fields use the empty string as "no change"; modifying a
// value to empty is not expressible.
message EventResponse {
  // 12 was modified_cwd: never honoured by the host; removed 2026-07.
  reserved 12;
  reserved "modified_cwd";

  // JSON-encoded chat.ChatMessage values appended to the context ("context").
  repeated string inject_messages = 1;
  // 0-based indices into the message list carried by this event's payload,
  // identifying messages to remove ("context"). The host applies removals in
  // descending index order; duplicate indices across plugins are undefined
  // behaviour.
  repeated int32 remove_message_indices = 2;
  string inject_system_prompt = 3;            // appended to the system prompt
  string modified_tool_arguments = 4;         // JSON, for before_tool_exec
  bool block_tool_execution = 5;              // for before_tool_exec
  string block_reason = 6;
  string modified_tool_result = 7;            // JSON, for after_tool_exec
  map<string, string> add_headers = 8;        // for before_llm_call
  string modified_model_id = 9;               // for before_llm_call
  repeated Diagnostic diagnostics = 10;
  bool suppress_default = 11;
}

// --- Event payload types ---

message SessionEventPayload {
  string session_id = 1;
  string model_id = 2;
  string provider = 3;
}

// ContextPayload carries the full conversation so far. The whole history is
// serialised into every dispatch, so this payload (and BeforeLLMCallPayload)
// can approach gRPC's 4 MB default message limit in long sessions; when that
// happens the host logs the dispatch failure and skips the event for that
// plugin.
message ContextPayload {
  repeated string messages = 1;  // JSON-encoded chat.ChatMessage list
}

message BeforeLLMCallPayload {
  string model_id = 1;
  repeated string messages = 2;  // JSON-encoded chat.ChatMessage list
  map<string, string> headers = 3;
  string parameters = 4;         // JSON-encoded chat.ChatParameters
}

message AfterLLMCallPayload {
  string model_id = 1;
  string finish_reason = 2;
  string usage = 3;              // JSON-encoded chat.ChatUsage
}

message ToolCallPayload {
  string tool_name = 1;
  string arguments = 2;          // JSON
  string call_id = 3;
}

message ToolResultPayload {
  // 6 was duration: never populated by the host; removed 2026-07.
  reserved 6;
  reserved "duration";

  string tool_name = 1;
  string arguments = 2;          // JSON
  string result = 3;             // JSON
  bool is_error = 4;
  string call_id = 5;
}

message TurnPayload {
  string direction = 1;        // "start" or "end"
  int32 turn_number = 2;
}

// --- Tools ---

message ToolDefinition {
  string name = 1;
  string description = 2;
  string input_schema = 3;  // JSON Schema as string
}

message GetToolsRequest {}
message GetToolsResponse {
  repeated ToolDefinition tools = 1;
}

message ExecuteToolRequest {
  string tool_name = 1;
  string arguments = 2;  // JSON string
}
message ExecuteToolResponse {
  string content = 1;   // JSON string (tool result content)
  bool is_error = 2;
}

// --- Capabilities ---

message GetCapabilitiesRequest {}

// The canonical capability strings are "commands", "tools", "events",
// "interactive", and "views" (mirrored by the Capability* Go constants in
// this package). The set is open: the host ignores unknown values, so new
// capabilities can be added without breaking older hosts.
//
// An empty list is treated by the host as the full legacy surface (commands,
// tools, events) for backward compatibility; a plugin cannot advertise zero
// capabilities. "views" is never assumed and must be opted into explicitly.
message GetCapabilitiesResponse {
  repeated string capabilities = 1;
}

// --- Init ---

// InitRequest hands the plugin the broker id of the host's HostService so the
// plugin can dial back. Sent once by the host right after handshake, before
// any command or tool runs.
message InitRequest {
  uint32 host_broker_id = 1;  // go-plugin broker id for the host HostService
  string plugin_name = 2;     // the plugin's registered name
}
message InitResponse {}

// --- Views / Panels ---

// View is a structured panel a plugin renders into the host UI, either
// attached to a command result (sync) or pushed independently via
// HostService.RenderView (async). Re-sending a View with the same Id
// replaces its content in place (used for live-updating async panels).
message View {
  string id = 1;          // scoped to the plugin; host prefixes with plugin name
  string title = 2;       // optional panel title/header
  repeated Widget widgets = 3;
  Style style = 4;        // optional panel-level style (tone/border)
}

// Style carries semantic, theme-aware presentation hints. Plugins should
// prefer `tone` (resolved to tau's theme palette host-side) over raw hex,
// so panels stay visually consistent across theme changes; hex is an
// escape hatch, not the primary mechanism.
message Style {
  enum Tone {
    TONE_DEFAULT = 0;
    TONE_INFO = 1;
    TONE_SUCCESS = 2;
    TONE_WARN = 3;
    TONE_ERROR = 4;
    TONE_MUTED = 5;
  }
  Tone tone = 1;
  string fg_hex = 2;   // optional override, e.g. "#ffae00"
  string bg_hex = 3;   // optional override
  bool bold = 4;
  bool dim = 5;
  bool italic = 6;
  bool underline = 7;
}

// Widget is one renderable element within a View. Exactly one field of
// `kind` is set. Unrecognized/unset kinds on older hosts are simply
// skipped at render time - the same additive-evolution guarantee as
// EventPayload's oneof.
message Widget {
  oneof kind {
    TextWidget text = 1;
    StackWidget stack = 2;
    KeyValueWidget key_value = 3;
    ListWidget list = 4;
    TableWidget table = 5;
    ProgressWidget progress = 6;
    DividerWidget divider = 7;
    StatusWidget status = 8;
  }
}

message TextWidget {
  string text = 1;
  Style style = 2;
}

message StackWidget {
  enum Direction {
    // Vertical is the deliberate zero value: an unset direction stacks
    // children top-to-bottom.
    DIRECTION_VERTICAL = 0;
    DIRECTION_HORIZONTAL = 1;
  }
  Direction direction = 1;
  repeated Widget children = 2;
  int32 gap = 3; // spacing between children, in cells (horizontal) or blank lines (vertical)
}

message KeyValueWidget {
  message Entry {
    string key = 1;
    string value = 2;
    Style value_style = 3;
  }
  repeated Entry entries = 1;
}

message ListWidget {
  repeated string items = 1;
  bool ordered = 2;      // numbered vs bulleted
  Style style = 3;
}

message TableWidget {
  repeated string headers = 1;
  message Row {
    repeated string cells = 1;
  }
  repeated Row rows = 2;
}

message ProgressWidget {
  string label = 1;
  double fraction = 2;   // 0.0-1.0; negative = indeterminate
  Style style = 3;
}

message DividerWidget {
  string label = 1; // optional centered label
}

message StatusWidget {
  enum State {
    // Neutral is the zero value so a default-constructed widget renders
    // inert rather than as a running spinner.
    STATE_NEUTRAL = 0;
    STATE_RUNNING = 1;
    STATE_SUCCESS = 2;
    STATE_FAILED = 3;
  }
  State state = 1;
  string label = 2;
  string detail = 3;
}

message RenderViewRequest {
  // The calling plugin's registered name. The SDK's hostClient fills this in
  // automatically. The host currently trusts it as sent, so it scopes view
  // ownership but is NOT a security boundary between plugins.
  string plugin_name = 1;
  View view = 2;
}
message RenderViewResponse {}

message CloseViewRequest {
  string plugin_name = 1;  // same trust caveat as RenderViewRequest
  string view_id = 2;
}
message CloseViewResponse {}

// --- Logging ---

message LogEntry {
  string level = 1;        // "debug", "info", "warn", "error"
  string message = 2;
  map<string, string> fields = 3;  // structured fields
}

message LogRequest {
  LogEntry entry = 1;
}
message LogResponse {}

// --- Host service messages (plugin -> host reverse RPCs) ---

message GetConfigRequest {
  // Which plugin's `plugins.<name>` config block to read. Filled in by the
  // SDK's hostClient with the caller's own name; the host currently trusts
  // it as sent (see RenderViewRequest.plugin_name).
  string plugin_name = 1;
  string key = 2;          // optional dotted key; empty returns the whole block
}
message GetConfigResponse {
  string value = 1;  // JSON-encoded value (object or scalar)
  bool found = 2;
}

message SetConfigRequest {
  string plugin_name = 1;  // same trust caveat as GetConfigRequest
  string key = 2;
  string value = 3;  // JSON-encoded value
}
message SetConfigResponse {}

message GetSessionStateRequest {
  string session_id = 1;  // empty = active session
}
message GetSessionStateResponse {
  string state_json = 1;  // JSON-encoded chat.ChatSessionState
  bool found = 2;
}

message GetAvailableModelsRequest {}
message GetAvailableModelsResponse {
  repeated string models = 1;
}

message NotifyRequest {
  string level = 1;    // "info", "warn", "error"
  string message = 2;
}
message NotifyResponse {}

// Confirm grants plugins the ability to ask the user for confirmation.
message ConfirmRequest {
  string title = 1;
  string description = 2;
}
message ConfirmResponse {
  bool confirmed = 1;
  bool canceled = 2;
}

// Input grants plugins the ability to prompt the user for text.
message InputRequest {
  string title = 1;
  string placeholder = 2;
}
message InputResponse {
  string value = 1;
  bool canceled = 2;
}

// --- Services ---

service ExtensionService {
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  rpc DispatchEvent(DispatchEventRequest) returns (DispatchEventResponse);
  rpc GetTools(GetToolsRequest) returns (GetToolsResponse);
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  rpc Log(LogRequest) returns (LogResponse);

  // Init hands the plugin the broker id of the host's HostService so the
  // plugin can dial back. Called once by the host right after handshake.
  rpc Init(InitRequest) returns (InitResponse);

  // GetCapabilities reports which capability types the plugin provides so the
  // host can skip unsupported calls and evolve the protocol additively.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// HostService is served by the tau host and called by plugins via the
// go-plugin broker. It gives plugins read access to host config/state and
// the ability to push notifications and structured logs back to tau.
service HostService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
  rpc GetSessionState(GetSessionStateRequest) returns (GetSessionStateResponse);
  rpc GetAvailableModels(GetAvailableModelsRequest) returns (GetAvailableModelsResponse);
  rpc Notify(NotifyRequest) returns (NotifyResponse);
  rpc Log(LogRequest) returns (LogResponse);
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
  rpc Input(InputRequest) returns (InputResponse);
  rpc RenderView(RenderViewRequest) returns (RenderViewResponse);
  rpc CloseView(CloseViewRequest) returns (CloseViewResponse);
}
