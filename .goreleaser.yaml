version: 2

project_name: tau

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: tau
    main: ./cmd/tau
    binary: tau
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Upload to Artifactory (no GitHub releases).
artifactories:
  - name: westpac-artifactory
    mode: archive
    target: "{{ .Env.ARTIFACTORY_URL }}/tau/{{ .Version }}/"
    username: "{{ .Env.ARTIFACTORY_USER }}"

# Disable GitHub-specific features since we use Bitbucket.
release:
  disable: true

changelog:
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
