version: "2"

run:
  go: "1.25"

linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - goprintffuncname
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unused
    - whitespace
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        text: "Error return value of `.*(Write|WriteString|WriteDirect|WriteStyled|WriteGradient|ExitRawMode|EnterRawMode|Interrupt|Kill|Shutdown|Close|Flush|sendNotification|InitGopls|Sync|Read|Fprint|Fprintf|Remove|Rollback|RegisterPluginTool|MkdirAll|WriteFile)` is not checked"
  settings:
    staticcheck:
      checks: ["SA*", "S*"]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
